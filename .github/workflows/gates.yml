name: gates
on: [push, pull_request]

jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install ruff + pre-commit
        run: |
          uv tool install ruff
          uv tool install pre-commit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install gitleaks (best-effort; self-test skips it if absent)
        run: |
          v=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" -o gl.tgz \
            && tar xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && gitleaks version \
            || echo "gitleaks install skipped"

      - name: Self-test — gates block bad fixtures, pass good
        run: bash tests/selftest.sh

      - name: pre-commit on all real files
        run: pre-commit run --all-files --config guardrails/.pre-commit-config.yaml

      - name: Dependency existence + age (online, full mode)
        run: node guardrails/scripts/check-packages.mjs --ecosystem npm --scan tests/fixtures/good/package.json
